<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>NPC Gift Guide</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Nunito:ital,wght@0,400;0,600;0,700;1,500&display=swap">
<style>
/* Layout: sticky search bar on top, one row per NPC with Perfect and Good columns; stacks into cards on phones. */
:root {
  --bg: #f6f4ef;
  --surface: #ffffff;
  --fg: #1f2420;
  --muted: #5d655f;
  --line: #d9d6cc;
  --perfect: #1d6b4f;
  --perfect-bg: #e1f1e9;
  --good: #8a5a12;
  --good-bg: #f8ecd2;
  --mark: #ffe27a;
  --focus: #1d6b4f;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Nunito", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #151a17;
    --surface: #1d2420;
    --fg: #ecefe9;
    --muted: #a3ada5;
    --line: #333d37;
    --perfect: #7fd3ae;
    --perfect-bg: #1f3a2f;
    --good: #f0c46e;
    --good-bg: #3b3018;
    --mark: #6b5a12;
    --focus: #7fd3ae;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #151a17;
  --surface: #1d2420;
  --fg: #ecefe9;
  --muted: #a3ada5;
  --line: #333d37;
  --perfect: #7fd3ae;
  --perfect-bg: #1f3a2f;
  --good: #f0c46e;
  --good-bg: #3b3018;
  --mark: #6b5a12;
  --focus: #7fd3ae;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 20px;
  line-height: 1.45;
  padding-block: 0 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
body::before {
  content: "";
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  background: var(--bg);
  z-index: 10;
}
.wrap { max-width: 1280px; margin: 0 auto; }

header.top {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 5;
  background: var(--bg);
  padding-block: 20px 14px;
  border-bottom: 1px solid var(--line);
}
h1 {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 2rem;
  line-height: 1.1;
  margin: 0 0 12px;
  text-wrap: balance;
}
.search-row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.search-row input {
  flex: 1 1 280px;
  min-width: 0;
  font: inherit;
  font-size: 1.1rem;
  padding: 12px 16px;
  color: var(--fg);
  background: var(--surface);
  border: 2px solid var(--line);
  border-radius: 10px;
}
.search-row input:focus-visible { outline: 3px solid var(--focus); outline-offset: 1px; border-color: var(--focus); }
.count { color: var(--muted); font-size: 0.95rem; font-variant-numeric: tabular-nums; }
.hint { color: var(--muted); font-size: 0.9rem; margin: 8px 0 0; }

.cols, .row {
  display: grid;
  grid-template-columns: minmax(150px, 0.7fr) 1.5fr 1.5fr;
  gap: 8px 24px;
  align-items: start;
}
.cols {
  padding: 16px 20px 8px;
  font-family: var(--font-display);
  font-size: 0.85rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
}
.cols .p { color: var(--perfect); }
.cols .g { color: var(--good); }

.list { display: flex; flex-direction: column; gap: 8px; margin-top: 4px; }
.row {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 14px 20px;
}
.npc { font-family: var(--font-display); font-weight: 700; font-size: 1.25rem; line-height: 1.2; }
.npc small { display: block; font-family: var(--font-body); font-weight: 600; font-size: 0.9rem; color: var(--muted); margin-top: 2px; }
.items { display: flex; flex-wrap: wrap; gap: 6px 8px; min-width: 0; }
.chip { padding: 2px 10px; border-radius: 999px; font-weight: 600; font-size: 1rem; }
.perfect .chip { background: var(--perfect-bg); color: var(--perfect); }
.good .chip { background: var(--good-bg); color: var(--good); }
.chip.any { font-style: italic; font-weight: 500; }
mark { background: var(--mark); color: inherit; border-radius: 3px; padding: 0 2px; }
.label { display: none; }
.empty { padding: 48px 0; text-align: center; color: var(--muted); }

@media (max-width: 760px) {
  body { font-size: 18px; }
  .cols { display: none; }
  .row { grid-template-columns: 1fr; gap: 10px; }
  .label {
    display: block;
    font-family: var(--font-display);
    font-size: 0.78rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  .perfect .label { color: var(--perfect); }
  .good .label { color: var(--good); }
}
</style>

<div class="wrap">
  <header class="top">
    <h1>NPC Gift Guide</h1>
    <div class="search-row">
      <input id="q" type="search" placeholder="Search an NPC or an item, like Pell or Moonstone" autocomplete="off" aria-label="Search NPCs or items">
      <span class="count" id="count" aria-live="polite"></span>
    </div>
    <p class="hint">Searching an item shows every NPC who likes it. Italic items are categories.</p>
  </header>

  <div class="cols" aria-hidden="true">
    <div>NPC</div>
    <div class="p">Perfect (+80)</div>
    <div class="g">Good (+45)</div>
  </div>
  <div class="list" id="list"></div>
  <p class="empty" id="empty" hidden>No NPC or item matches that search.</p>
</div>

<script>
var DATA = [
  ["Pell", "", "Roast Dinner, Hearty Stew, Blackberry Cobbler, Moonstone", "Wood, Bread, Baked Potato, Corn on the Cob, any dish"],
  ["Bram", "smith", "Ruby, Gold Ore, Spicy Tacos, Hot Pepper", "any ore, Hearty Stew, Roast Dinner, Bread"],
  ["Quill", "", "Diamond, Golden Fish, Star Fruit, Saffron", "Emerald, Sapphire, Grape Juice, Cake, Strawberry Tart"],
  ["Wren", "", "Fish Tacos, Sashimi, Golden Fish, Tiger Trout", "any fish, Fried Fish, Corn on the Cob, Bread, Hash Browns"],
  ["Juniper", "", "Glowcap Mushroom, Silvercap Mushroom, Saffron, Aloe, Amethyst", "any forage, Marigold, Sunflower, Garden Salad, Butterfly"],
  ["Rosa", "", "Strawberry Tart, Cake, Rose Quartz, Moonstone, Fruit Jam", "Bread, Blueberry, Sunflower, Marigold, Grape Juice, Berry Pie"],
  ["Marlow", "", "Parsnip Soup, Carrot Cake, Hearty Stew", "Carrot, any fish, Bread"],
  ["Maren", "Elder", "Pumpkin Soup, Bread, Rose Quartz", "any dish"],
  ["Tamsin", "", "Wheat, Strawberry, Blackberry", "any crop"],
  ["Hazel", "", "Star Fruit, Sunflower, Cantaloupe", "any crop"],
  ["Odette", "", "Cake, Grape Juice", "any dish"],
  ["Tilly", "tailor", "Amethyst, Rose Quartz, Butterfly", "Sunflower, Marigold"],
  ["Farthing", "", "Gold Ore, Diamond", "Emerald, Sapphire"],
  ["Marven", "", "Moonstone, Sapphire", "any fish"],
  ["Dunn", "", "Hearty Stew, Topaz", "any ore"],
  ["Silas", "", "Marsh Eel, Glowcap Mushroom", "any fish"],
  ["Wick", "", "Marsh Eel", "Bread"],
  ["Rowan", "", "Watermelon, Fruit Salad", "any crop"],
  ["Hollis", "", "Pumpkin, Cabbage, Carrot", "Wheat, Corn"],
  ["Greta", "", "Berry Pie, Strawberry Tart", "Marigold, Sunflower"],
  ["Mabel", "", "Bread, Blueberry", "Corn"],
  ["Ansel", "", "Moonstone, Pumpkin Soup", "Sunflower"],
  ["Dara", "", "Blackberry Cobbler, Berry Pie", "Blueberry, Strawberry"],
  ["Cole", "", "Hearty Stew, Roast Dinner", "any dish"],
  ["Fenwick", "", "Corn on the Cob, Casserole", "Bread"],
  ["Ivy", "", "Marigold, Sunflower", "Saffron, Strawberry"],
  ["Otto", "", "Fried Fish, Hash Browns", "Popcorn"],
  ["Lena", "", "Cabbage, Cauliflower, Broccoli", "any crop"],
  ["Hugo", "", "Wheat, Bread, Cake", "Corn"],
  ["Jory", "", "Golden Fish, Ghost Catfish, Grape Juice", "any fish"],
  ["Nixie", "mermaid", "Quartz, Rose Quartz, Diamond, Sapphire", "any ore"],
  ["Jasper", "♂→♀", "Fried Fish, Hearty Stew, Sapphire, Grape Juice", "Wood, any fish, Bread, Corn on the Cob"],
  ["Felix", "♂→♀", "Cake, Strawberry Tart, Grape Juice, Rose Quartz", "Bread, Sunflower, Marigold, Berry Pie, Fruit Jam"],
  ["Rhys", "♂→♀", "Pumpkin Soup, Roast Dinner, Baked Potato, Star Fruit", "any crop, Bread, Hearty Stew, Corn on the Cob"],
  ["Faelan", "elf → ♀", "Moonstone, Star Fruit, Sunflower, Blueberry", "any forage, Bread, Fruit Salad, Amethyst"],
  ["Clara", "♀→♂", "Strawberry, Blackberry Cobbler, Wheat, Fruit Jam", "any crop, Blueberry, Marigold, Sunflower"],
  ["Elsie", "♀→♂", "Amethyst, Moonstone, Sunflower, Grape Juice", "Marigold, Saffron, Cake, Garden Salad, Fruit Salad"],
  ["Willa", "♀→♂", "Sunflower, Marigold, Berry Pie, Blueberry", "any forage, Strawberry, Bread, Fruit Smoothie"],
  ["Liora", "elf → ♂", "Cake, Strawberry Tart, Rose Quartz, Grape Juice", "Marigold, Sunflower, Berry Pie, Fruit Jam, Amethyst"]
];

var listEl = document.getElementById("list");
var emptyEl = document.getElementById("empty");
var countEl = document.getElementById("count");
var input = document.getElementById("q");

function esc(s) {
  return s.replace(/[&<>"]/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
  });
}
function hl(text, q) {
  var safe = esc(text);
  if (!q) return safe;
  var i = text.toLowerCase().indexOf(q);
  if (i < 0) return safe;
  return esc(text.slice(0, i)) + "<mark>" + esc(text.slice(i, i + q.length)) + "</mark>" + esc(text.slice(i + q.length));
}
function chips(str, q) {
  return str.split(", ").map(function (it) {
    var any = it.indexOf("any ") === 0;
    return '<span class="chip' + (any ? " any" : "") + '">' + hl(it, q) + "</span>";
  }).join("");
}
function render() {
  var q = input.value.trim().toLowerCase();
  var out = [];
  DATA.forEach(function (r) {
    var hay = (r[0] + " " + r[1] + " " + r[2] + ", " + r[3]).toLowerCase();
    if (q && hay.indexOf(q) < 0) return;
    out.push(
      '<div class="row">' +
        '<div class="npc">' + hl(r[0], q) + (r[1] ? "<small>" + hl(r[1], q) + "</small>" : "") + "</div>" +
        '<div class="perfect"><span class="label">Perfect (+80)</span><div class="items">' + chips(r[2], q) + "</div></div>" +
        '<div class="good"><span class="label">Good (+45)</span><div class="items">' + chips(r[3], q) + "</div></div>" +
      "</div>"
    );
  });
  listEl.innerHTML = out.join("");
  emptyEl.hidden = out.length > 0;
  countEl.textContent = out.length + " of " + DATA.length + " NPCs";
}
input.addEventListener("input", render);
render();
</script>

</body></html>
